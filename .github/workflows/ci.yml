name: BMW iFACTORY MLOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/raw
          mkdir -p data/feature_store
          mkdir -p data/drift_reports
          mkdir -p models

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 pipeline/ serving/ monitoring/ dashboard/ tests/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,W291,W293,F401 \
            --exclude=__pycache__
        continue-on-error: true

      - name: Run pytest suite
        run: |
          pytest tests/ -v --tb=short --no-header

      - name: Run full pipeline smoke test
        run: |
          python run_pipeline.py

      - name: Verify output artifacts
        run: |
          python -c "
          import json, os
          assert os.path.exists('models/registry_info.json'), 'registry_info.json not found'
          info = json.load(open('models/registry_info.json'))
          assert info['stage'] == 'Production', 'Model not in Production'
          print(f'Production model: v{info[\"version\"]} ({info[\"model_name\"]})')
          print(f'F1: {info[\"cv_f1\"]:.4f}  Recall: {info[\"recall\"]:.4f}')
          print('All checks passed')
          "

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: data/drift_reports/
          if-no-files-found: ignore

      - name: Upload pipeline log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-log
          path: models/
          if-no-files-found: ignore